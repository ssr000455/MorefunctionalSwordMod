name: Build Server Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Native with Gradle
        run: ./gradlew :native:buildNative

      - name: Build Mod JAR
        run: ./gradlew build

      - name: Rename artifact
        run: |
          VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          cp build/libs/mfswordmod-${VERSION}.jar build/libs/mfswordmod-${VERSION}-server.jar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mfswordmod-server
          path: build/libs/*-server.jar