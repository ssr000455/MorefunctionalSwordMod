name: Build Server Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26c" >> $GITHUB_ENV
      - name: Build Native .so
        run: |
          mkdir -p src/main/resources/native
          $ANDROID_NDK_HOME/bin/clang -O2 -fPIC -shared -D__ANDROID__ \
            -I native/src/main/c \
            -I $ANDROID_NDK_HOME/sysroot/usr/include \
            -I $JAVA_HOME/include \
            -I $JAVA_HOME/include/linux \
            native/src/main/c/mfswordmod_native.c \
            native/src/main/c/dobby.c \
            -o src/main/resources/native/libmfswordmod-arm64.so \
            -llog -ldl
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle build
      - name: Rename artifact
        run: |
          VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          cp build/libs/mfswordmod-${VERSION}.jar build/libs/mfswordmod-${VERSION}-server.jar
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mfswordmod-server
          path: build/libs/*-server.jar
