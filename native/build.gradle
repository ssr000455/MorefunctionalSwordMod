tasks.register("buildNative") {
    group = "build"
    description = "编译 arm64-v8a 的 .so"

    doLast {
        def ndk = "/data/data/com.termux/files/usr/lib/android-ndk"
        if (!file(ndk).exists()) {
            throw new GradleException("请安装 NDK: pkg install ndk-multilib")
        }

        def srcDir = file("src/main/c")
        def buildDir = file("build/obj")
        def outDir = file("build/lib")

        outDir.mkdirs()

        exec {
            commandLine "${ndk}/bin/cmake",
                "-H${srcDir}",
                "-B${buildDir}",
                "-DCMAKE_TOOLCHAIN_FILE=${ndk}/build/cmake/android.toolchain.cmake",
                "-DANDROID_ABI=arm64-v8a",
                "-DANDROID_PLATFORM=android-24",
                "-DCMAKE_BUILD_TYPE=Release",
                "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${outDir}"
        }

        exec {
            commandLine "make", "-C", "${buildDir}", "-j4"
        }

        println " .so 已生成: ${outDir}/libmfswordmod.so"
    }
}

tasks.register("cleanNative") {
    delete file("build")
}