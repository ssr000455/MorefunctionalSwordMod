tasks.register("buildNative") {
    group = "build"
    description = "编译 .so 并复制到模组资源目录"

    doLast {
        def srcDir = file("src/main/c")
        def targetDir = file("../src/main/resources/native")
        targetDir.mkdirs()

        def ndkHome = System.getenv("ANDROID_NDK_HOME")
        def javaHome = System.getenv("JAVA_HOME")

        // 使用 ARM64 交叉编译链
        def clang = file("${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang")
        if (!clang.exists()) {
            clang = file("${ndkHome}/bin/aarch64-linux-android24-clang")
        }
        if (!clang.exists()) {
            throw new GradleException("找不到 aarch64-linux-android24-clang，请检查 NDK 版本")
        }

        def sysroot = "${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

        exec {
            commandLine clang.absolutePath,
                "-O2",
                "-fPIC",
                "-shared",
                "-D__ANDROID__",
                "-D__ANDROID_API__=24",
                "-I${srcDir}",
                "-I${sysroot}/usr/include",
                "-I${sysroot}/usr/include/aarch64-linux-android",
                "-I${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/17/include",
                "-I${javaHome}/include",
                "-I${javaHome}/include/linux",
                "${srcDir}/mfswordmod_native_core.c",
                "${srcDir}/mfswordmod_native_hook.c",
                "${srcDir}/dobby.c",
                "-o",
                "${srcDir}/mfswordmod_native_core.c",
                "${srcDir}/mfswordmod_native_hooks.c",
                "${srcDir}/mfswordmod_native_config.c",
                "${srcDir}/mfswordmod_native_tcp.c",
                "${targetDir}/libmfswordmod-arm64.so",
                "-ldl"
        }

        def soFile = file("${targetDir}/libmfswordmod-arm64.so")
        if (!soFile.exists()) {
            throw new GradleException("编译失败：.so 文件未生成")
        }
        println "✅ .so 已生成: ${soFile.absolutePath} (大小: ${soFile.length()} bytes)"
    }
}

tasks.register("cleanNative") {
    delete file("build")
    delete file("../src/main/resources/native")
}