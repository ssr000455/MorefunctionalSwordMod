tasks.register("buildNative") {
    group = "build"
    description = "编译 .so 并复制到模组资源目录"

    doLast {
        def srcDir = file("src/main/c")
        def targetDir = file("../src/main/resources/native")
        targetDir.mkdirs()

        def ndkHome = System.getenv("ANDROID_NDK_HOME")
        def javaHome = System.getenv("JAVA_HOME")

        def clang = file("${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang")
        if (!clang.exists()) {
            clang = file("${ndkHome}/bin/clang")
        }

        exec {
            commandLine clang.absolutePath,
                "-O2",
                "-fPIC",
                "-shared",
                "-D__ANDROID__",
                "-I${srcDir}",
                "-I${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include",
                "-I${javaHome}/include",
                "-I${javaHome}/include/linux",
                "${srcDir}/mfswordmod_native.c",
                "${srcDir}/dobby.c",
                "-o",
                "${targetDir}/libmfswordmod-arm64.so",
                "-ldl"
        }

        println " .so 已生成: ${targetDir}/libmfswordmod-arm64.so"
    }
}

tasks.register("cleanNative") {
    delete file("build")
    delete file("../src/main/resources/native")
}